# Docker Compose configuration for Smart Agriculture IoT System

services:
  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart-agriculture-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # 前端通过Nginx代理访问API，不需要知道具体IP
      - REACT_APP_API_BASE_URL=${REACT_APP_API_BASE_URL:-}
      - REACT_APP_AUTH_SERVICE_URL=${REACT_APP_AUTH_SERVICE_URL:-/api/auth}
      - REACT_APP_ENCRYPTION_SERVICE_URL=${REACT_APP_ENCRYPTION_SERVICE_URL:-/api/encrypt}
      - REACT_APP_AUDIT_SERVICE_URL=${REACT_APP_AUDIT_SERVICE_URL:-/api/events}
      - REACT_APP_SENSOR_SERVICE_URL=${REACT_APP_SENSOR_SERVICE_URL:-/api/sensors}
      - REACT_APP_DECISION_SERVICE_URL=${REACT_APP_DECISION_SERVICE_URL:-/api/decisions}
      - REACT_APP_DATA_SERVICE_URL=${REACT_APP_DATA_SERVICE_URL:-/api/data}
    networks:
      - smart-agriculture-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Authentication Service
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: smart-agriculture-auth
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - MASTER_ENCRYPTION_KEY=${MASTER_ENCRYPTION_KEY}
      - MONGODB_URI=${MONGODB_URI}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - AUDIT_LOG_PATH=/app/logs/security-audit.log
    volumes:
      - ./logs:/app/logs
      - ./auth-service:/app
    networks:
      - smart-agriculture-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp

  # Encryption Service
  encryption-service:
    build:
      context: ./encryption-service
      dockerfile: Dockerfile
    container_name: smart-agriculture-encryption
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - MASTER_ENCRYPTION_KEY=${MASTER_ENCRYPTION_KEY}
    networks:
      - smart-agriculture-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  # Security Audit Service
  security-audit:
    build:
      context: ./security-audit
      dockerfile: Dockerfile
    container_name: smart-agriculture-audit
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - PORT=3003
      - AUDIT_LOG_PATH=/app/logs/security-audit.log
      - MONGODB_URI=${MONGODB_URI}
    volumes:
      - ./logs:/app/logs
      - ./security-audit:/app
    networks:
      - smart-agriculture-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  # Sensor API Service
  sensor-api:
    build:
      context: .
      dockerfile: Dockerfile.sensor-api
    container_name: smart-agriculture-sensor-api
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=production
      - PORT=3004
      - MQTT_BROKER_URL=${MQTT_BROKER_URL:-mqtt://test.mosquitto.org:1883}
    networks:
      - smart-agriculture-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3004/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Decision Engine Service
  decision-engine:
    build:
      context: ./decision-engine-service
      dockerfile: Dockerfile
    container_name: smart-agriculture-decision-engine
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=production
      - PORT=3005
      - MONGODB_URI=${MONGODB_URI}
      - MQTT_BROKER_URL=${MQTT_BROKER_URL:-mqtt://test.mosquitto.org:1883}
    networks:
      - smart-agriculture-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3005/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Data Processing Service
  data-processing:
    build:
      context: ./data-processing-service
      dockerfile: Dockerfile
    container_name: smart-agriculture-data-processing
    ports:
      - "3006:3006"
    environment:
      - NODE_ENV=production
      - PORT=3006
      - MONGODB_URI=${MONGODB_URI}
      - MQTT_BROKER_URL=${MQTT_BROKER_URL:-mqtt://test.mosquitto.org:1883}
    networks:
      - smart-agriculture-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3006/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    container_name: smart-agriculture-nginx
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/security-headers.conf:/etc/nginx/conf.d/security-headers.conf:ro
    networks:
      - smart-agriculture-network
    restart: unless-stopped
    depends_on:
      - frontend
      - auth-service
      - encryption-service
      - security-audit
      - sensor-api
      - decision-engine
      - data-processing
    security_opt:
      - no-new-privileges:true

  # Redis Cache
  redis:
    image: redis:alpine
    container_name: smart-agriculture-redis
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis-security-data:/data
    networks:
      - smart-agriculture-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

networks:
  smart-agriculture-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  redis-security-data:
    driver: local
