# Docker Compose configuration for Smart Agriculture IoT System

services:
  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart-agriculture-frontend
    # 端口不暴露，通过Nginx代理访问
    environment:
      - NODE_ENV=production
      # 前端通过Nginx代理访问API，不需要知道具体IP
      - REACT_APP_API_BASE_URL=${REACT_APP_API_BASE_URL:-}
      - REACT_APP_AUTH_SERVICE_URL=${REACT_APP_AUTH_SERVICE_URL:-/api/auth}
      - REACT_APP_ENCRYPTION_SERVICE_URL=${REACT_APP_ENCRYPTION_SERVICE_URL:-/api/encrypt}
      - REACT_APP_AUDIT_SERVICE_URL=${REACT_APP_AUDIT_SERVICE_URL:-/api/events}
      - REACT_APP_SENSOR_SERVICE_URL=${REACT_APP_SENSOR_SERVICE_URL:-/api/sensors}
      - REACT_APP_DECISION_SERVICE_URL=${REACT_APP_DECISION_SERVICE_URL:-/api/decisions}
      - REACT_APP_DATA_SERVICE_URL=${REACT_APP_DATA_SERVICE_URL:-/api/data}
    networks:
      - smart-agriculture-network
    restart: unless-stopped
    # 移除健康检查以减少资源消耗

  # Authentication Service
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: smart-agriculture-auth
    # 端口不暴露，通过Nginx代理访问
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - MASTER_ENCRYPTION_KEY=${MASTER_ENCRYPTION_KEY}
      - MONGODB_URI=${MONGODB_URI}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - AUDIT_LOG_PATH=/app/logs/security-audit.log
    volumes:
      - ./logs:/app/logs
    networks:
      - smart-agriculture-network
    restart: unless-stopped
    # 移除健康检查以减少资源消耗
    security_opt:
      - no-new-privileges:true

  # Encryption Service
  encryption-service:
    build:
      context: ./encryption-service
      dockerfile: Dockerfile
    container_name: smart-agriculture-encryption
    # 端口不暴露，通过Nginx代理访问
    environment:
      - NODE_ENV=production
      - PORT=3002
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - MASTER_ENCRYPTION_KEY=${MASTER_ENCRYPTION_KEY}
    networks:
      - smart-agriculture-network
    restart: unless-stopped
    # 移除健康检查以减少资源消耗
    security_opt:
      - no-new-privileges:true

  # Security Audit Service
  security-audit:
    build:
      context: ./security-audit
      dockerfile: Dockerfile
    container_name: smart-agriculture-audit
    # 端口不暴露，通过Nginx代理访问
    environment:
      - NODE_ENV=production
      - PORT=3003
      - AUDIT_LOG_PATH=/app/logs/security-audit.log
      - MONGODB_URI=${MONGODB_URI:-mongodb+srv://s224387234:123456qwerty@sit314.4orhwty.mongodb.net/?retryWrites=true&w=majority&appName=sit314}
    volumes:
      - ./logs:/app/logs
    networks:
      - smart-agriculture-network
    restart: unless-stopped
    # 移除健康检查以减少资源消耗
    security_opt:
      - no-new-privileges:true

  # Sensor API Service
  sensor-api:
    build:
      context: .
      dockerfile: Dockerfile.sensor-api
    container_name: smart-agriculture-sensor-api
    # 端口不暴露，通过Nginx代理访问
    environment:
      - NODE_ENV=production
      - PORT=3004
      - MQTT_BROKER_URL=${MQTT_BROKER_URL:-mqtt://test.mosquitto.org:1883}
    networks:
      - smart-agriculture-network
    restart: unless-stopped
    # 移除健康检查以减少资源消耗

  # Decision Engine Service
  decision-engine:
    build:
      context: ./decision-engine-service
      dockerfile: Dockerfile
    container_name: smart-agriculture-decision-engine
    # 端口不暴露，通过Nginx代理访问
    environment:
      - NODE_ENV=production
      - PORT=3005
      - MONGODB_URI=${MONGODB_URI:-mongodb+srv://s224387234:123456qwerty@sit314.4orhwty.mongodb.net/?retryWrites=true&w=majority&appName=sit314}
      - MQTT_BROKER_URL=${MQTT_BROKER_URL:-mqtt://test.mosquitto.org:1883}
    networks:
      - smart-agriculture-network
    restart: unless-stopped
    # 移除健康检查以减少资源消耗

  # Data Processing Service
  data-processing:
    build:
      context: ./data-processing-service
      dockerfile: Dockerfile
    container_name: smart-agriculture-data-processing
    # 端口不暴露，通过Nginx代理访问
    environment:
      - NODE_ENV=production
      - PORT=3006
      - MONGODB_URI=${MONGODB_URI:-mongodb+srv://s224387234:123456qwerty@sit314.4orhwty.mongodb.net/?retryWrites=true&w=majority&appName=sit314}
      - MQTT_BROKER_URL=${MQTT_BROKER_URL:-mqtt://test.mosquitto.org:1883}
    networks:
      - smart-agriculture-network
    restart: unless-stopped
    # 移除健康检查以减少资源消耗

  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    container_name: smart-agriculture-nginx
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - smart-agriculture-network
    restart: unless-stopped
    depends_on:
      - frontend
      - auth-service
      - encryption-service
      - security-audit
      - sensor-api
      - decision-engine
      - data-processing
    security_opt:
      - no-new-privileges:true

  # Redis Cache
  redis:
    image: redis:alpine
    container_name: smart-agriculture-redis
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis-security-data:/data
    networks:
      - smart-agriculture-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

networks:
  smart-agriculture-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  redis-security-data:
    driver: local
